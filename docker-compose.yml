version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tech_village
    ports:
      - "5432:5432"
    volumes:
      - tech_village_pg_data:/var/lib/postgresql/data

volumes:
  tech_village_pg_data:
